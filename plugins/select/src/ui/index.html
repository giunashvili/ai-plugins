<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Select · Settings</title>
  <link id="app-style" rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
<main class="workspace">
  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v7c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 12v7c0 1.7 3.1 3 7 3s7-1.3 7-3v-7"/></svg></span>
        <span>Select</span>
      </div>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch color theme" title="Switch color theme">
        <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg>
      </button>
    </div>
    <div class="nav-heading">Projects</div>
    <nav id="projects" aria-label="Projects"></nav>
    <div class="project-add">
      <button id="new-project" class="secondary" type="button"><span aria-hidden="true">+</span> Project</button>
      <p id="project-status" role="status" aria-live="polite"></p>
    </div>
    <div class="sidebar-footer"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>Private to this computer</span></div>
  </aside>
  <section class="content" aria-labelledby="page-title">
    <div class="content-inner">
      <header class="page-header">
        <h1 id="page-title">Connections</h1>
      </header>
      <section class="panel">
        <div id="empty" class="empty-state">
          <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M12 11v6m-3-3h6"/></svg></div>
          <h2>A place for every project</h2>
          <p>Create your first project in the sidebar, then add environments like development or staging.</p>
          <span class="empty-note">Each environment keeps its own connection and credentials.</span>
        </div>
        <div id="editor" hidden>
          <div class="project-heading">
            <div class="project-summary" id="project-summary">
              <span class="project-color-dot" aria-hidden="true"></span><h2 id="project-title"></h2><span class="badge">MySQL</span>
              <div class="options-anchor">
                <button id="project-options" class="icon-button options-toggle" type="button" aria-label="Project options" title="Project options" aria-expanded="false" aria-controls="project-menu" disabled><span aria-hidden="true">⋯</span></button>
                <div id="project-menu" class="options-menu" role="group" aria-label="Project options" hidden>
                  <button id="rename-project" type="button">Rename project</button>
                  <div class="color-choices" role="group" aria-label="Project color"><span class="menu-label">Project color</span><div id="project-colors" class="color-swatches"></div></div>
                  <button id="delete-project" class="danger" type="button">Delete project…</button>
                </div>
              </div>
            </div>
            <div class="environment-tools">
              <label class="environment-picker" for="environment-select">Environment<select id="environment-select" aria-label="Environment"></select></label>
              <div class="options-anchor">
                <button id="environment-options" class="icon-button options-toggle" type="button" aria-label="Environment options" title="Environment options" aria-expanded="false" aria-controls="environment-menu" disabled><span aria-hidden="true">⋯</span></button>
                <div id="environment-menu" class="options-menu" role="group" aria-label="Environment options" hidden>
                  <button id="rename-environment" type="button">Rename environment</button>
                  <button id="delete-environment" class="danger" type="button">Delete environment…</button>
                </div>
              </div>
            </div>
          </div>
          <form id="connection">
            <section class="form-section" aria-labelledby="connection-title">
              <h3 id="connection-title" class="visually-hidden">New environment</h3>
              <div class="row equal"><label>Environment name<input name="environment" required autocomplete="off" placeholder="e.g. Staging"></label><label>Host<input name="host" required autocomplete="off" placeholder="db.example.com"></label></div>
              <div class="row"><label>Port<input name="port" type="number" min="1" max="65535" value="3306" required></label><label>Database<input name="database" required autocomplete="off" placeholder="Database name"></label></div>
            </section>
            <section class="form-section" aria-labelledby="credentials-title">
              <div class="section-heading"><h3 id="credentials-title">Credentials</h3></div>
              <div class="row equal"><label>Username<input name="user" required autocomplete="username" placeholder="Database username"></label><label>Password<input name="password" type="password" autocomplete="new-password" placeholder="Database password"></label></div>
            </section>
            <div class="tls-option"><label class="check"><input name="tls" type="checkbox" checked><span>Use TLS</span></label></div>
            <div class="form-actions">
              <div class="form-feedback"><p id="save-state" role="status" aria-live="polite"></p><p id="status" role="status" aria-live="polite"></p></div>
              <div class="action-buttons">
                <button type="button" id="test-connection" disabled>Test connection</button>
                <button class="primary" type="submit" id="save" disabled><span id="save-label">Save</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
              </div>
            </div>
          </form>
        </div>
      </section>
    </div>
  </section>
</main>
<dialog id="manage-dialog" aria-labelledby="manage-title" aria-describedby="manage-description">
  <form id="manage-form">
    <h2 id="manage-title"></h2>
    <p id="manage-description"></p>
    <label id="rename-field" for="manage-name"><span id="manage-name-label">New name</span><input id="manage-name" name="name" required autocomplete="off"></label>
    <p id="manage-error" role="alert"></p>
    <div class="dialog-actions"><button id="manage-cancel" type="button">Cancel</button><button id="manage-confirm" type="submit">Rename</button></div>
  </form>
</dialog>
</body>
</html>
